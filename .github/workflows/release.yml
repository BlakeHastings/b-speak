name: release

# Push a tag like v0.2.0 to build self-contained downloads for each platform and publish a GitHub release.
# Installed copies find it through `bspeak update`.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, ext: zip }
          - { os: ubuntu-latest, rid: linux-x64, ext: tar.gz }
          - { os: macos-latest, rid: osx-arm64, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        if: matrix.rid == 'linux-x64'
        run: dotnet test -c Release
      - name: Publish
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/BSpeak.Cli -c Release -r ${{ matrix.rid }} --self-contained -o out/bspeak
          mkdir -p out/bspeak/skill
          cp -r skills/b-speak out/bspeak/skill/
          cp LICENSE out/bspeak/
          echo "$version" > out/bspeak/bspeak.release
          name="bspeak-$version-${{ matrix.rid }}.${{ matrix.ext }}"
          cd out/bspeak
          if [ "${{ matrix.ext }}" = zip ]; then 7z a -tzip "../$name" . > /dev/null; else tar -czf "../$name" .; fi
          echo "ARCHIVE=out/$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: ${{ env.ARCHIVE }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "b-speak $GITHUB_REF_NAME" --generate-notes
