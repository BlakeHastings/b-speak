name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer reads the version from tags
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test
      - name: Smoke test (host and CLI, audio off)
        run: |
          dotnet build src/BSpeak.Cli -c Debug
          bash scripts/smoke.sh src/BSpeak.Cli/bin/Debug/net10.0/bspeak
